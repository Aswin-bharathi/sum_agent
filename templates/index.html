<!DOCTYPE html>
<html>
<head>
  <title>AI Notes Summarizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
</head>
<body>

<div class="container">
  <h1>📑 AI Notes Summarizer</h1>

  <form method="POST" enctype="multipart/form-data">
    <label>Upload File (PDF, TXT, DOCX):</label>
    <input type="file" name="file">
    
    <label>Or Paste Notes Here:</label>
    <textarea name="text" placeholder="Paste your notes here..."></textarea>
    
    <label>Summary Length:</label>
    <select name="summary_length">
      <option value="short">Short</option>
      <option value="medium">Medium</option>
      <option value="detailed">Detailed</option>
    </select>
    
    <button type="submit">Summarize</button>
  </form>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flash">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  {% if summary %}
  <div class="summary-card">
    <h2>📃 Summary</h2>
    <div id="summary-content"></div>

    <button onclick="readSummary()">🔊 Read Summary</button>
    <button onclick="downloadCleanSummary()">📥 Download Summary</button>
  </div>

  <div class="chatbot-card">
    <h2>💬 Ask Anything from Summary</h2>
    <div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Type your question and press Enter...">
    <button onclick="sendMessage()">Send</button>
  </div>
  {% endif %}
</div>

<script>
{% if summary %}
document.getElementById("summary-content").innerHTML = marked.parse(`{{summary|safe}}`);
{% endif %}

function readSummary() {
  const summaryText = document.getElementById("summary-content").innerText;
  const speech = new SpeechSynthesisUtterance(summaryText);
  speech.lang = 'en-US';
  window.speechSynthesis.speak(speech);
}

function downloadCleanSummary() {
  const rawText = document.getElementById("summary-content").innerText;
  const blob = new Blob([rawText], { type: "text/plain;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "summary.txt";
  link.click();
}

document.getElementById("userInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage();
});

function sendMessage() {
  const userInput = document.getElementById("userInput");
  const message = userInput.value.trim();
  if (!message) return;

  const chatbox = document.getElementById("chatbox");

  // Show user message
  chatbox.innerHTML += `<div class="user-msg">You: ${message}</div>`;
  chatbox.scrollTop = chatbox.scrollHeight;

  // Send to backend
  fetch("/chatbot", {
    method: "POST",
    body: JSON.stringify({ message }),
    headers: { "Content-Type": "application/json" }
  })
  .then(res => {
    if (!res.ok) throw new Error("Server error");
    return res.json();
  })
  .then(data => {
    chatbox.innerHTML += `<div class="bot-msg">${data.response}</div>`;
    chatbox.scrollTop = chatbox.scrollHeight;
  })
  .catch(err => {
    chatbox.innerHTML += `<div class="bot-msg">⚠️ ${err.message}</div>`;
    chatbox.scrollTop = chatbox.scrollHeight;
  });

  userInput.value = "";
}
</script>

</body>
</html>
